<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Встроенные стили для анимации и внешнего вида -->
  <style>
    .orb {
      /* Центр трансформации - середина иконки (16, 16) */
      transform-origin: center; 
      
      /* Анимация 'pulse' длится 3 секунды, плавно, бесконечно */
      animation: pulse 3s ease-in-out infinite;
    }

    /* Описание самой анимации */
    @keyframes pulse {
      0% {
        transform: scale(0.90);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.0);
        opacity: 1;
      }
      100% {
        transform: scale(0.90);
        opacity: 0.8;
      }
    }
    
    /* Для тёмной темы браузера сделаем сферу чуть ярче, чтобы она выделялась */
    @media (prefers-color-scheme: dark) {
      .orb-fill {
        fill: #a88bff;
      }
    }
  </style>

  <!-- Определения для фильтров, в нашем случае - для свечения -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Сама сфера. Группируем, чтобы применить анимацию и фильтр ко всему сразу -->
  <g class="orb" filter="url(#glow)">
     <!-- Фиолетовый круг в центре холста размером 32x32 -->
     <circle class="orb-fill" cx="16" cy="16" r="10" fill="#8A63D2" />
  </g>
</svg>